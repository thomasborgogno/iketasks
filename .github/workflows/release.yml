# Build and publish a release when a version tag is pushed.
#
# TRIGGER: push a tag in the format vX.Y.Z (e.g. v2.1.0).
#   git tag v2.1.0 && git push origin v2.1.0
#
# REQUIRED GitHub Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON  — base64-encoded content of android/app/google-services.json
#                           Generate: base64 -w 0 android/app/google-services.json
#
#   KEYSTORE_JKS          — base64-encoded release keystore (.jks)
#                           Generate keystore once (do this locally):
#                             keytool -genkey -v \
#                               -keystore eisenhower-keystore.jks \
#                               -alias eisenhower \
#                               -keyalg RSA -keysize 2048 -validity 10000
#                           Then encode: base64 -w 0 eisenhower-keystore.jks
#
#   KEYSTORE_PASSWORD     — password used when generating the keystore
#   KEY_ALIAS             — alias used when generating the keystore (e.g. eisenhower)
#   KEY_PASSWORD          — key password (can be same as KEYSTORE_PASSWORD)

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > ${{ github.workspace }}/eisenhower-keystore.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

      - name: Extract version from tag
        id: version
        run: |
          # github.ref_name is the tag name, e.g. v2.1.0
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | grep -v "^${{ github.ref_name }}$" \
            | tail -1)

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          if [ -z "$LOG" ]; then
            LOG="- No changes recorded"
          fi

          echo "## What's changed" > changelog.md
          echo "" >> changelog.md
          echo "$LOG" >> changelog.md

      - name: Build APKs (split per ABI)
        env:
          KEYSTORE_PATH:     ${{ github.workspace }}/eisenhower-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.version.outputs.version_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "IkeTasks v${{ steps.version.outputs.version_name }}"
          body_path: changelog.md
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
